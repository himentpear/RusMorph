name: publish_android_release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish_android_release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/xlsx_builder/requirements.txt
      - name: Install data build requirements
        run: python -m pip install -r tools/xlsx_builder/requirements.txt
      - name: Restore release keystore
        env:
          RUSMORPH_RELEASE_STORE_BASE64: ${{ secrets.RUSMORPH_RELEASE_STORE_BASE64 }}
        run: |
          test -n "$RUSMORPH_RELEASE_STORE_BASE64"
          printf '%s' "$RUSMORPH_RELEASE_STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/rusmorph-release.jks"
      - name: Test and build production release
        env:
          RUSMORPH_RELEASE_STORE_FILE: ${{ runner.temp }}/rusmorph-release.jks
          RUSMORPH_RELEASE_STORE_PASSWORD: ${{ secrets.RUSMORPH_RELEASE_STORE_PASSWORD }}
          RUSMORPH_RELEASE_KEY_ALIAS: ${{ secrets.RUSMORPH_RELEASE_KEY_ALIAS }}
          RUSMORPH_RELEASE_KEY_PASSWORD: ${{ secrets.RUSMORPH_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew buildLexiconAssets verifyLexiconAssets
          ./gradlew testLocalDebugUnitTest
          ./gradlew assembleProductionRelease
      - name: Generate stable update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          mapfile -t APKS < <(find app/build/outputs/apk/production/release -maxdepth 1 -type f -name '*.apk')
          test "${#APKS[@]}" -eq 1
          RELEASE_FILENAME="RusMorph-${VERSION_NAME}-production.apk"
          mkdir -p release
          cp "${APKS[0]}" "release/${RELEASE_FILENAME}"
          python tools/generate_update_manifest.py \
            --apk "release/${RELEASE_FILENAME}" \
            --tag "$RELEASE_TAG" \
            --output release/android-stable.json
          (cd release && sha256sum "${RELEASE_FILENAME}" > "${RELEASE_FILENAME}.sha256")
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          RELEASE_FILENAME="RusMorph-${VERSION_NAME}-production.apk"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "RusMorph ${VERSION_NAME}" \
            --generate-notes \
            "release/${RELEASE_FILENAME}" \
            "release/${RELEASE_FILENAME}.sha256" \
            "release/android-stable.json"
